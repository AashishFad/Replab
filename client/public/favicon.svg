<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="rGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C8FF" />
      <stop offset="50%" stop-color="#0091FF" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="100%" stop-color="#0B1120" />
    </linearGradient>
  </defs>

  <!-- Dark Background -->
  <rect width="100" height="100" rx="20" fill="url(#bg)" />

  <!-- Outer Flask Beaker forming "R" -->
  <path d="M 36 18 H 60 C 74 18 80 26 80 37 C 80 47 74 54 62 55 L 82 82 H 66 L 50 56 H 40" 
        stroke="url(#rGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 38 18 L 22 74 C 20 80 25 82 30 82 H 68" 
        stroke="url(#rGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Internal DAG Workflow Nodes -->
  <!-- Top Cyan Node -->
  <rect x="44" y="24" width="12" height="12" rx="3.5" fill="#00D2FF" />

  <!-- Connector to Decision Diamond -->
  <path d="M 50 36 V 43" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />

  <!-- Green Decision Diamond -->
  <rect x="44.5" y="44.5" width="11" height="11" rx="2" fill="#00E599" transform="rotate(45 50 50)" />

  <!-- Branching Connectors -->
  <path d="M 50 57 V 63 H 37 V 68 M 50 63 H 63 V 68" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Bottom Left Purple Node -->
  <rect x="31" y="68" width="12" height="12" rx="3.5" fill="#A855F7" />

  <!-- Bottom Right Cyan Node -->
  <rect x="57" y="68" width="12" height="12" rx="3.5" fill="#00D2FF" />
</svg>
